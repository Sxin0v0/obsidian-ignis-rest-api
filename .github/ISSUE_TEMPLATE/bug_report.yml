name: Bug report
description: Report a reproducible problem in the Ignis community port.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, private vault content, cookies, or internal URLs."
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: ignis
    attributes:
      label: Ignis version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - REST API
        - MCP
        - Markdown patching
        - Browser bridge
        - Installation / configuration
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use example.com and placeholder credentials only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
